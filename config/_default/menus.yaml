# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: About us
    url: /#aboutus
    weight: 2
  - name: Members
    url: /#team
    weight: 3
  - name: News
    url: news/
    weight: 4
  - name: Publications
    url: papers/
    weight: 5
  # Projects page is kept in `content/projects/` but not built or reachable.
  # To restore it, uncomment below and remove the `_build`/`cascade` block in
  # `content/projects/_index.md`.
  # - name: Projects
  #   url: projects/
  #   weight: 6
